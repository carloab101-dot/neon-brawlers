<!-- Tiny Planet x4: the tile duel wrapped around a small planet, with Sakura Tora and Count Mochi built from fused signed-distance blobs
     in four different materials (Gummy / Plush / Liquid Chrome / Porcelain). Three.js r149 (MIT) inlined for offline use.
     NEXT VERSION button, keys 1-4 or ?v=1..4 switch versions; drag to orbit, pinch or wheel to zoom; R or the RESTART button restarts. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:#05060a;font-family:"Helvetica Neue",Arial,sans-serif}
#three{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}#three:active{cursor:grabbing}
#three canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;color:#e8f6ff;--a:#ff4fa8;--b:#35e8ff;--card:linear-gradient(160deg,#fbfcff 0%,#dfe5ef 45%,#c3ccdb 100%);--ink:#151a28;--tfont:900 30px "Arial Black","Helvetica Neue",Arial,sans-serif}
#hud .t3{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;font:var(--tfont);letter-spacing:5px;white-space:nowrap}
#hud .t3 small{display:block;font:600 11px "Helvetica Neue",Arial,sans-serif;letter-spacing:2px;opacity:.75;margin-top:4px}
#hud .cd{position:absolute;top:86px;width:min(28vw,290px);height:108px;border-radius:12px;padding:12px 16px 10px 62px;box-sizing:border-box;background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.7);transition:transform .08s}
#hud .cd.l{left:22px}#hud .cd.r{right:22px}#hud .cd.hit{transform:translateX(3px) rotate(.6deg)}#hud .cd.ko{filter:grayscale(.8) brightness(.8)}
#hud .cd .ix,#hud .cd .ix2{position:absolute;font:900 30px Georgia,serif;text-align:center;line-height:1;width:40px}#hud .cd .ix{left:12px;top:10px}#hud .cd .ix2{right:8px;bottom:6px;transform:rotate(180deg);font-size:17px}
#hud .cd .ix small,#hud .cd .ix2 small{display:block;font-size:.72em}
#hud .cd.l .ix,#hud .cd.l .ix2{color:#b3123e}#hud .cd.r .ix,#hud .cd.r .ix2{color:#121420}
#hud .nm{font:800 16px "Helvetica Neue",Arial,sans-serif;letter-spacing:.5px}#hud .st{font:700 10px Arial,sans-serif;height:13px;letter-spacing:1.5px;opacity:.7;margin-top:2px}
#hud .bar{position:relative;height:12px;margin-top:7px;margin-right:24px;background:rgba(10,12,20,.85);border-radius:7px;overflow:hidden}#hud .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
#hud .bar .g{background:rgba(255,255,255,.85)}#hud .l .bar .f{background:linear-gradient(90deg,var(--a),#ffc2dc)}#hud .r .bar .f{background:linear-gradient(90deg,var(--b),#d8fbff)}#hud .bar .f.low{background:linear-gradient(90deg,#ff2244,#ff9a55)!important}
#hud .hp{font:700 11px Arial,sans-serif;margin-top:4px;opacity:.8}
#hud .co{position:absolute;top:206px;font:italic 900 22px "Arial Black",Arial,sans-serif;color:#fff;opacity:0;white-space:nowrap;text-shadow:0 0 12px var(--a)}#hud .co.l{left:26px}#hud .co.r{right:26px;text-shadow:0 0 12px var(--b)}
#hud .dm{position:absolute;font:italic 900 32px "Arial Black",Arial,sans-serif;color:#fff;white-space:nowrap;text-shadow:0 0 10px var(--a),0 2px 0 rgba(0,0,0,.5)}#hud .dm.c{color:#ffd66b;font-size:40px}#hud .dm.m{font-size:20px;text-shadow:0 0 10px var(--b)}
#hud .big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font:900 108px "Arial Black",Arial,sans-serif;letter-spacing:8px;color:#fff;text-shadow:0 0 22px var(--a),0 0 50px var(--b);display:none;white-space:nowrap}
#hud .sub{position:absolute;left:50%;top:55%;transform:translateX(-50%);font:900 28px "Arial Black",Arial,sans-serif;color:#fff;text-shadow:0 0 12px var(--b);display:none;text-align:center;white-space:nowrap}#hud .sub small{display:block;font:600 14px Arial,sans-serif;margin-top:8px;opacity:.85}
#hud .ft{position:absolute;bottom:14px;left:22px;font:600 12px Arial,sans-serif;opacity:.7;text-shadow:0 0 4px #000;white-space:nowrap}
#next,#restart{position:fixed;z-index:20;cursor:pointer;user-select:none;transition:transform .12s,background .15s,box-shadow .15s}
#next{top:14px;right:14px;text-align:right;line-height:1.25;padding:10px 16px;font:800 14px "Helvetica Neue",Arial,sans-serif;letter-spacing:2.5px}#next small{display:block;font-size:11px;letter-spacing:1px;margin-top:3px;opacity:.9;font-weight:600}
#restart{bottom:14px;right:14px;padding:10px 20px;font:800 13px "Helvetica Neue",Arial,sans-serif;letter-spacing:3px}
#next:active,#restart:active{transform:translateY(2px)}
/* --- per-version theming --- */
body.v-gummy #hud{--a:#ff4f9a;--b:#39e0c8;--card:linear-gradient(160deg,rgba(255,240,250,.92),rgba(255,196,228,.88));--ink:#5a1238;color:#fff;--tfont:900 30px "Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif}
body.v-gummy #hud .t3{letter-spacing:6px;color:#fff;text-shadow:0 3px 0 #ff4f9a,0 6px 0 #b0226a,0 0 22px rgba(255,120,200,.7)}
body.v-gummy #hud .cd{border-radius:28px;border:3px solid rgba(255,255,255,.9);box-shadow:inset 0 -8px 16px rgba(255,80,160,.25),inset 0 6px 10px rgba(255,255,255,.9),0 10px 26px rgba(120,20,80,.45)}
body.v-gummy #hud .bar{border-radius:10px;height:13px}
body.v-gummy #next,body.v-gummy #restart{color:#fff;background:linear-gradient(180deg,#ff8cc4,#ff4f9a);border:3px solid #fff;border-radius:30px;box-shadow:inset 0 4px 6px rgba(255,255,255,.6),0 6px 16px rgba(120,20,80,.5);font-family:"Trebuchet MS",sans-serif}
body.v-gummy #next:hover,body.v-gummy #restart:hover{background:linear-gradient(180deg,#ffa8d4,#ff6fae)}
body.v-plush #hud{--a:#e8506a;--b:#5ab0d8;--card:#f4e8d4;--ink:#4a2e22;color:#fff6ea;--tfont:900 30px "Comic Sans MS","Trebuchet MS",sans-serif}
body.v-plush #hud .t3{letter-spacing:5px;color:#fff6ea;text-shadow:0 3px 0 #8a4a3a,0 0 14px rgba(0,0,0,.4)}
body.v-plush #hud .cd{border-radius:18px;border:3px dashed #a8745a;outline:6px solid #f4e8d4;box-shadow:0 12px 26px rgba(40,20,10,.55);background-image:repeating-linear-gradient(45deg,rgba(120,80,50,.06) 0 2px,transparent 2px 5px),linear-gradient(#f4e8d4,#f4e8d4)}
body.v-plush #hud .bar{border-radius:8px;border:2px dashed rgba(255,255,255,.6)}
body.v-plush #next,body.v-plush #restart{color:#4a2e22;background:#f4e8d4;border:3px dashed #a8745a;border-radius:16px;box-shadow:0 0 0 5px #f4e8d4,0 8px 18px rgba(40,20,10,.5);font-family:"Comic Sans MS","Trebuchet MS",sans-serif}
body.v-plush #next:hover,body.v-plush #restart:hover{background:#fff4e2}
body.v-chrome #hud{--a:#ff6fb0;--b:#7ae8ff;--card:linear-gradient(170deg,#f4f8ff 0%,#9aa6ba 38%,#eef2fa 52%,#5a6478 100%);--ink:#0c1020;color:#e8f2ff;--tfont:900 30px "Arial Black","Helvetica Neue",Arial,sans-serif}
body.v-chrome #hud .t3{letter-spacing:7px;background:linear-gradient(180deg,#fff 0%,#9aa8c0 48%,#3a4460 52%,#dfe8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(120,220,255,.6))}
body.v-chrome #hud .t3 small{color:#cfe6ff;-webkit-text-fill-color:#cfe6ff}
body.v-chrome #hud .cd{border-radius:10px;border:1px solid #fff;box-shadow:0 0 0 2px #3a4460,0 0 22px rgba(120,220,255,.35),0 12px 26px rgba(0,0,0,.6)}
body.v-chrome #next,body.v-chrome #restart{color:#0c1020;background:linear-gradient(170deg,#fff,#9aa6ba 45%,#eef2fa 55%,#6a748a);border:1px solid #fff;border-radius:8px;box-shadow:0 0 0 2px #3a4460,0 0 16px rgba(120,220,255,.45)}
body.v-chrome #next:hover,body.v-chrome #restart:hover{filter:brightness(1.12)}
body.v-porc #hud{--a:#d8455a;--b:#2d5bb8;--card:linear-gradient(160deg,#fffdf8,#eef2f8);--ink:#1a2a5a;color:#fffdf6;--tfont:500 30px Georgia,"Times New Roman",serif}
body.v-porc #hud .t3{letter-spacing:9px;color:#fffdf6;text-shadow:0 2px 0 #2d5bb8,0 0 16px rgba(20,40,110,.6)}
body.v-porc #hud .cd{border-radius:14px;border:2px solid #c9a24a;box-shadow:0 0 0 4px #fffdf8,0 0 0 6px #2d5bb8,0 12px 26px rgba(10,20,50,.5);background-image:radial-gradient(circle at 92% 20%,rgba(45,91,184,.14) 0 18px,transparent 19px),linear-gradient(160deg,#fffdf8,#eef2f8)}

body.v-porc #next,body.v-porc #restart{color:#1a2a5a;background:linear-gradient(160deg,#fffdf8,#e6ecf6);border:2px solid #c9a24a;border-radius:12px;box-shadow:0 0 0 3px #2d5bb8,0 8px 18px rgba(10,20,50,.45);font-family:Georgia,serif}
body.v-porc #next:hover,body.v-porc #restart:hover{background:#fff}

// with a ShaderMaterial that raymarches a signed-distance sculpt in "cat space" (the fighter group's local space):
//  * ray: camera position and the box fragment are taken into cat space (uW2C); the ray is clipped to the box (slab test).
//  * scene: smooth-unioned SDF sculpts per body part, each part evaluated in its own BONE space: uB[i] = inverse bone matrix

//  * culling: every part group has a bounding sphere (uBS, CPU) - outside it the march only sees the sphere distance, so the
//    detailed SDF is evaluated only near that part.
//  * depth: the hit point goes back to world space (uC2W) and through the real camera projection (uVP) -> gl_FragDepth, so the
//    cats composite correctly with the board, each other and the FX. Misses are discarded (except the ink silhouette band).
//  * ink look: two-value wash with ragged brush edge, cool ink-grey shadow, crevice pooling (SDF AO), paper grain, contour from

//  * KO: domain-split shatter: space is cut into cells that fly apart (grid expansion + per-cell spin), each shard clipped to
