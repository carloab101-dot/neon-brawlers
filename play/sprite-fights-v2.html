<!DOCTYPE html>
<html lang="en">

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh}
#next{position:fixed;top:14px;right:14px;z-index:10;cursor:pointer;text-align:right;line-height:1.25;user-select:none;padding:9px 15px;transition:transform .12s}
#next small{display:block;font-size:12px;opacity:.9;margin-top:2px}
#next.nes{font:bold 15px "Press Start 2P","Courier New",monospace;background:#000;color:#fcfcfc;border:4px solid #fcfcfc;box-shadow:0 0 0 4px #000,6px 6px 0 4px #0058f8;border-radius:0;letter-spacing:1px;text-transform:uppercase}
#next.nes small{font-size:9px;color:#f8b800}
#next.nes:hover{background:#0058f8}
#next.neon{font:600 16px "Segoe UI",Rajdhani,"Helvetica Neue",Arial,sans-serif;letter-spacing:3px;background:rgba(0,10,20,.7);color:#00f0ff;border:1.5px solid #00f0ff;border-radius:2px;
 box-shadow:0 0 10px #00f0ff,inset 0 0 10px rgba(0,240,255,.35);text-shadow:0 0 8px #00f0ff;text-transform:uppercase}
#next.neon small{color:#ff2bd6;text-shadow:0 0 8px #ff2bd6;letter-spacing:2px}
#next.neon:hover{background:rgba(0,240,255,.15)}
#next.ink{font:700 20px "Segoe Print","Bradley Hand","Comic Sans MS",Caveat,Kalam,cursive;background:#f7f0de;color:#1c1a17;border:2.5px solid #1c1a17;
 border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:3px 4px 0 rgba(28,26,23,.25);transform:rotate(-2deg)}
#next.ink small{font-size:14px}
#next.ink:hover{transform:rotate(1deg) scale(1.04)}
#next.toon{font:900 17px "Arial Black","Luckiest Guy",Impact,sans-serif;background:#ffd43b;color:#1d1b2a;border:4px solid #1d1b2a;border-radius:18px;box-shadow:0 6px 0 #1d1b2a;letter-spacing:1px}
#next.toon small{font:800 12px Arial,sans-serif;color:#7a3b00}
#next.toon:hover{transform:translateY(-3px) scale(1.05)}
#next:active{transform:translateY(3px)}
</style>

<body>
<canvas id="c"></canvas>
<button id="next" class="nes" title="Switch matchup (keys 1-4)"><span id="nl1">NEXT FIGHT</span><small id="nl2">Up next</small></button>
<script>
'use strict';
// ====================================================================
//  CORE SETUP
// ====================================================================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas'),bctx=buf.getContext('2d',{willReadFrequently:true});
const H=144,GY=118,M=12;
let W=256,SC=5,DPR=1,C=ctx,ST=null,FX=null;
const rr=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,k)=>a+(b-a)*k,clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[(Math.random()*a.length)|0];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const easeOutBack=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
const easeOutElastic=k=>k<=0?0:k>=1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*2*Math.PI/3)+1;
const INK='#1c1a17',OUT='#1d1b2a';
const FONT_NEON='"Segoe UI",Rajdhani,"Helvetica Neue",Arial,sans-serif';
const FONT_INK='"Segoe Print","Bradley Hand","Comic Sans MS",Caveat,Kalam,cursive';
const FONT_TOON='"Arial Black","Luckiest Guy",Impact,sans-serif';

// ---------- NES palette + quantizer ----------
const NESHEX=['#000000','#fcfcfc','#bcbcbc','#7c7c7c','#a4e4fc','#3cbcfc','#0078f8','#0000fc','#b8b8f8','#6888fc','#0058f8','#0000bc','#d8b8f8','#9878f8','#6844fc','#4428bc','#f8b8f8','#f878f8','#d800cc','#940084','#f8a4c0','#f85898','#e40058','#a80020','#f0d0b0','#f87858','#f83800','#a81000','#fce0a8','#fca044','#e45c10','#881400','#f8d878','#f8b800','#ac7c00','#503000','#d8f878','#b8f818','#00b800','#007800','#b8f8b8','#58d854','#00a800','#006800','#b8f8d8','#58f898','#00a844','#005800','#00fcfc','#00e8d8','#008888','#004058','#f8d8f8','#787878'];
const NESP=NESHEX.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const LUT=new Uint8Array(32768);
for(let i=0;i<32768;i++){const r=((i>>10)<<3)|4,g=(((i>>5)&31)<<3)|4,b=((i&31)<<3)|4;let best=0,bd=1e9;
  for(let j=0;j<NESP.length;j++){const p=NESP[j],d=(r-p[0])*(r-p[0])*.3+(g-p[1])*(g-p[1])*.59+(b-p[2])*(b-p[2])*.11;if(d<bd){bd=d;best=j;}}LUT[i]=best;}
function nesQuantize(){const id=bctx.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const p=NESP[LUT[((d[i]>>3)<<10)|((d[i+1]>>3)<<5)|(d[i+2]>>3)]];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255;}bctx.putImageData(id,0,0);}

// ---------- 3x5 pixel font ----------
const PF={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','.':'000000000000010','!':'010010010000010','-':'000000111000000',':':'000010000010000','/':'001001010100100',"'":'010010000000000','>':'100010001010100',' ':'000000000000000'};
function ptext(c,s,x,y,col,sc,align,shadow){sc=sc||1;s=String(s).toUpperCase();const adv=4*sc,w=s.length*adv-sc;
  let x0=align==='center'?Math.round(x-w/2):align==='right'?Math.round(x-w):Math.round(x);y=Math.round(y);
  const passes=shadow===null?[1]:[0,1];
  for(const pass of passes){c.fillStyle=pass?col:(shadow||'#000000');const o=pass?0:sc;
    for(let i=0;i<s.length;i++){const gl=PF[s[i]];if(!gl)continue;for(let k=0;k<15;k++)if(gl[k]==='1')c.fillRect(x0+i*adv+(k%3)*sc+o,y+((k/3)|0)*sc+o,sc,sc);}}}

// ====================================================================
//  NES SPRITES (knight & dragon)
// ====================================================================
const SPR={
knight:{scale:2,hand:[16,10],pal:{K:'#000000',S:'#fcfcfc',s:'#bcbcbc',W:'#fcfcfc',R:'#f83800',r:'#a81000',G:'#f8b800',C:'#0058f8',c:'#0000bc',B:'#ac7c00',V:'#000000',Y:'#fcfcfc'},rows:[
"........RR..........",".......RRrR.........","......KKRKK.........",".....KSSSSSK........","....KSWSSSSSK.......","....KSSSVVVVK...W...","....KSSSSSSSK..KYK..",".....KssSSsK...KYK..",
"...cCKKKKKKKK..KYK..","..cCKSSSGSSSSK.KYK..","..cCKSWSGSSSSKKKYK..","..cCKSSSGSSSsKSKYK..","..cCKsSSGSSsKSSKYK..","..cCKKKGGGKKKKSGGGG.","..cCKSSKGKSSK.KBBK..","..cCKsSSSSSsK..KBK..",
"...cKKKKKKKKK...K...","....KSSK.KSSK.......","....KSSK.KSSK.......","....KsSK.KsSK.......","....KSSK.KSSK.......","...KSSSK.KSSSK......","...KKKKK.KKKKK......"]},
dragon:{scale:2,hand:[26,6],pal:{K:'#000000',D:'#00b800',d:'#006800',L:'#f8d878',E:'#f8b800',W:'#fcfcfc',R:'#e40058',r:'#a80020'},rows:[
"..................WW.W......","................KKDDKDK.....","...KK..........KDDDDDDKK....","..KRRK........KDDEKDDDDDK...",".KRrRRK.......KDDDDDDDDDDKK.",".KRrrRRK......KDDDDDDDDDDDDK","KRrRrrRRK.....KdDDDKKWKWKWK.","KRrRrRrRRK....KdDDDDDKKKKK..",
"KRrRrRrRRRK..KdDDDDK........","KRrRrRrRRRRKKdDDDDK.........",".KRrRrRrRRRKdDDLLDK.........","..KRrRrRRRKdDDLLLLDK........","...KKRrRRKdDDDLLLLDDK.......",".....KKKKdDDDDLLLLDDDK......","........KdDDDDLLLLDKDK......",".......KdDDDDDLLLLDKWK......",
"......KdDDDDDDLLLLDK........",".....KdDDDDDDDLLLDDK........","...KKdDDDDDDDDDLLDDK........",".KKdDDDKdDDDDDDDDDDK........","KdDDDKK.KdDDDKKdDDDK........","KDDKK...KdDDK..KdDDK........",".KK.....KdDDK..KdDDK........","........KDDDK..KDDDK........",".......KWKWKK.KWKWKK........"]}
};
function buildSprite(d){const w=Math.max(...d.rows.map(r=>r.length)),h=d.rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const f=document.createElement('canvas');f.width=w;f.height=h;const fx=f.getContext('2d');fx.fillStyle='#fcfcfc';
  d.rows.forEach((row,y)=>{for(let i=0;i<row.length;i++){const col=d.pal[row[i]];if(!col)continue;x.fillStyle=col;x.fillRect(i,y,1,1);fx.fillRect(i,y,1,1);}});
  d.img=c;d.flashImg=f;d.w=w;d.h=h;}
Object.values(SPR).forEach(buildSprite);

// ====================================================================
//  CHARACTERS & MATCHES
// ====================================================================
const CHARS={
 knight:{name:'SIR GALAHAD',spr:'knight',color:'#a4e4fc',attacks:[
  {name:'Blade Slash',style:'slash',dmg:11,color:'#fcfcfc'},{name:'Holy Lance',style:'lance',dmg:10,color:'#f8d878'},{name:'Divine Smite',style:'pillar',dmg:17,color:'#f8d878'}]},
 dragon:{name:'IGNIS THE DRAGON',spr:'dragon',color:'#58d854',attacks:[
  {name:'Tail Whip',style:'tail',dmg:10,color:'#58d854'},{name:'Fireball',style:'fireball',dmg:10,color:'#fca044'},{name:'Inferno Breath',style:'breath',dmg:18,color:'#f83800'}]},
 ninja:{name:'KAGE THE NINJA',draw:'ninja',bw:28,bh:46,hand:[13,-24],color:'#ff2bd6',attacks:[
  {name:'Shadow Strike',style:'dash',dmg:11,color:'#ff2bd6'},{name:'Shuriken Storm',style:'shuriken',dmg:11,color:'#e0e8ff'},{name:'Smoke Bomb Ambush',style:'teleport',dmg:17,color:'#b388ff'}]},
 robot:{name:'UNIT RX-9',draw:'robot',bw:32,bh:50,hand:[14,-25],color:'#00f0ff',attacks:[
  {name:'Piston Punch',style:'punch',dmg:11,color:'#ffe14d'},{name:'Plasma Blaster',style:'plasma',dmg:10,color:'#00f0ff'},{name:'Overload EMP',style:'shockwave',dmg:17,color:'#7df9ff'}]},
 wizard:{name:'Eldrin the Wise',draw:'wizard',bw:32,bh:54,hand:[12,-47],color:'#5f3dc4',attacks:[
  {name:'Staff Bonk',style:'bonk',dmg:10,color:'#e8a33d'},{name:'Arcane Missiles',style:'arcane',dmg:11,color:'#9c6ade'},{name:'Meteor Call',style:'meteor',dmg:18,color:'#e8590c'}]},
 slime:{name:'Gloopus the Slime',draw:'slime',bw:44,bh:34,hand:[16,-9],color:'#2b8a3e',attacks:[
  {name:'Body Slam',style:'slam',dmg:11,color:'#51cf66'},{name:'Acid Spit',style:'acid',dmg:10,color:'#94d82d'},{name:'Slime Tsunami',style:'wave',dmg:17,color:'#40c057'}]},
 pirate:{name:'CAPT. RUSTBEARD',draw:'pirate',bw:30,bh:56,hand:[11,-21],color:'#ff6b6b',arm:[.9,-2.4,.5],attacks:[
  {name:'Cutlass Slash',style:'slash',dmg:11,color:'#e9ecef',word:'SHING!'},{name:'Flintlock Shot',style:'bullet',dmg:10,color:'#ffd43b',word:'BANG!'},{name:'Cannon Barrage',style:'barrage',dmg:18,color:'#ff922b',word:'KABOOM!'}]},
 shark:{name:'CHOMP THE SHARK-MAN',draw:'shark',bw:34,bh:58,hand:[17,-33],color:'#4dabf7',attacks:[
  {name:'Jaw Chomp',style:'chomp',dmg:11,color:'#ffffff',word:'CHOMP!'},{name:'Water Jet',style:'water',dmg:10,color:'#74c0fc',word:'SPLASH!'},{name:'Tidal Whirlpool',style:'whirlpool',dmg:17,color:'#339af0',word:'SPLOOSH!'}]}
};
for(const k in CHARS){const c=CHARS[k];if(c.spr){const s=SPR[c.spr];c.bw=s.w*s.scale;c.bh=s.h*s.scale;c.hand=[(s.hand[0]+.5-s.w/2)*s.scale,-(s.h-s.hand[1]-.5)*s.scale];}}
const MATCHES=[
 {name:'Castle Siege',style:0,a:'knight',b:'dragon'},
 {name:'Neon Rooftop Rumble',style:1,a:'ninja',b:'robot'},
 {name:'Enchanted Forest Duel',style:2,a:'wizard',b:'slime'},
 {name:'Ship Deck Showdown',style:3,a:'pirate',b:'shark'}
];

// ====================================================================
//  GAME STATE
// ====================================================================
const G={match:0,fighters:[],ents:[],parts:[],texts:[],callout:null,shake:0,flash:0,flashCol:'#fff',dim:0,dimT:0,over:false,overT:0,winner:null,
 turn:0,turnDelay:1.4,time:0,dt:0,slow:0,hitstop:0,round:1,introT:0,anim:{}};
window.__G=G;
function makeFighter(key,side){const c=CHARS[key];
  return {key,c,side,facing:side===0?1:-1,x:0,px:0,y:GY,homeX:0,hp:100,disp:100,bar:100,barv:0,state:'idle',st:0,t:Math.random()*10,flash:0,vx:0,vy:0,oy:0,lift:0,rot:0,lean:0,
   sq:0,sqv:0,alpha:1,attack:null,lastAtk:-1,faceOverride:0,lockFace:false,spd:0,walk:0};}
const other=f=>G.fighters[1-f.side];
const bodyH=f=>f.c.bh,bodyW=f=>f.c.bw;
const center=f=>({x:f.x,y:f.y+f.oy+f.lift-f.c.bh/2});
function handPos(f){const face=f.faceOverride||f.facing;return {x:f.x+face*f.c.hand[0],y:f.y+f.oy+f.lift+f.c.hand[1]};}
function homes(){const d=Math.min(66,W*.28);return [Math.round(W/2-d),Math.round(W/2+d)];}
function resetRound(newRound){const m=MATCHES[G.match];
  G.fighters=[makeFighter(m.a,0),makeFighter(m.b,1)];const h=homes();G.fighters.forEach((f,i)=>{f.homeX=h[i];f.x=f.px=h[i];f.y=GY;});
  G.ents=[];G.parts=[];G.texts=[];G.callout=null;G.over=false;G.overT=0;G.winner=null;G.dim=G.dimT=0;G.flash=0;G.shake=0;
  G.turn=Math.random()<.5?0:1;G.turnDelay=1.5;G.introT=1.6;G.round=newRound?G.round+1:1;}
// ====================================================================
//  PARTICLES / ENTITIES
// ====================================================================
function P(x,y,vx,vy,life,color,size,grav,drag,kind){G.parts.push({x,y,vx,vy,life,max:life,color,size:size||1,grav:grav||0,drag:drag||0,kind:kind||''});}
function burst(x,y,cols,n,spd,size,grav){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*(spd||90);P(x,y,Math.cos(a)*s,Math.sin(a)*s-20,rr(.25,.65),pick(cols),Math.random()<.5?(size||2):Math.max(1,(size||2)-1),grav??150,2);}}
function smoke(x,y,n){for(let i=0;i<(n||24);i++)P(x+rr(-9,9),y+rr(-14,14),rr(-35,35),rr(-35,10),rr(.4,.8),pick(['#8a8aa0','#b0b0c4','#6a6a80','#d8d8e8']),(rr(3,6))|0,-25,2,'smoke');}
function ent(e){e.t=0;e.dead=false;G.ents.push(e);return e;}
function arcPts(x,y,r,a0,a1,dir,fy,n){const o=[];for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);o.push([x+Math.cos(a)*r*dir,y+Math.sin(a)*r*fy]);}return o;}
function slashFx(x,y,dir,color,r,flipY){return ent({update(dt){this.t+=dt;return this.t<.26;},draw(){const k=this.t/.26,sw=Math.min(1,k*3);
  FX.alpha(k<.5?1:1-(k-.5)*2);FX.arc(arcPts(x,y,r,-1.25,-1.25+2.5*sw,dir,flipY?-1:1,14),color,3.5);FX.alpha(1);}});}
function ghost(f){const g=Object.assign({},f,{alpha:.35,flash:0});ent({update(dt){this.t+=dt;g.alpha=.35*(1-this.t/.25);return this.t<.25;},draw(){drawFighter(g);}});}
function addDmg(b,dmg){const n=G.texts.filter(t=>t.target===b&&t.life>t.max-.5).length;const c=center(b);
  G.texts.push({text:'-'+dmg,x:c.x+rr(-4,4),y:b.y+b.oy-b.c.bh-4-n*8,vy:-22,life:1,max:1,target:b});}

function hit(a,b,dmg,o){o=o||{};if(b.state==='ko'||G.over)return;
  dmg=Math.max(1,Math.round(dmg*rr(.85,1.15)));b.hp=Math.max(0,b.hp-dmg);b.flash=.14;G.hitstop=.05;b.sqv-=7;
  G.shake=Math.max(G.shake,o.shake||3);const c=center(b);
  ST.hitFx(c.x,c.y,o.color||['#ffffff','#ffd166'],o.word||(a.attack&&a.attack.def.word),o.n||14);
  addDmg(b,dmg);
  const dir=Math.sign(b.x-a.x)||-b.facing,kb=(o.kb??70)*dir;
  if(b.hp<=0){b.state='ko';b.vx=kb*1.5;b.vy=-170;b.oy=-1;b.rot=0;b.lift=0;b.flash=.3;
    G.over=true;G.winner=a;G.overT=0;G.slow=.9;G.shake=9;G.flash=.35;G.flashCol='#ffffff';burst(c.x,c.y,['#ffffff','#ffd23f','#ff3b3b'],36,160,3,120);}
  else if(b.state!=='attack'){b.state='hit';b.st=.32;b.vx=kb;}}

function shoot(a,b,o){const h=handPos(a),c=center(b);
  const e=Object.assign({x:h.x,y:h.y,sx:h.x,sy:h.y,tx:c.x+(o.dx||0),ty:c.y+(o.dy||0),ang:0,dir:Math.sign(c.x-h.x)||1},o);
  e.dur=Math.max(.12,Math.hypot(e.tx-e.sx,e.ty-e.sy)/o.speed);
  e.update=function(dt){this.t+=dt;const k=Math.min(1,this.t/this.dur);
    this.x=lerp(this.sx,this.tx,k);this.y=lerp(this.sy,this.ty,k)-(this.arc||0)*4*k*(1-k);if(this.trail)this.trail(this,dt);
    if(k>=1){if(this.dmg)hit(a,b,this.dmg,this.hit||{});if(this.onHit)this.onHit(this);return false;}return true;};
  return ent(e);}

// ====================================================================
//  ATTACKS (generator coroutines; visuals via style-agnostic FX API)
// ====================================================================
function* walkTo(f,tx,speed,hop){let wt=0;
  while(Math.abs(tx-f.x)>1){const st=speed*G.dt;f.x+=Math.sign(tx-f.x)*Math.min(st,Math.abs(tx-f.x));wt+=G.dt;
    f.oy=hop?-Math.abs(Math.sin(wt*9))*7:-Math.abs(Math.sin(wt*14))*(ST.id===3?3.5:1.5);if(hop&&Math.abs(Math.sin(wt*9))<.15)f.sq=.2;yield 0;}
  f.x=tx;f.oy=0;}
function reachX(a,b,extra){return b.x-Math.sign(b.x-a.x)*((bodyW(a)+bodyW(b))*.32+4+(extra||0));}
function* windup(a,t,amt){for(let k=0;k<t;k+=G.dt){a.lean=-(amt||.2)*(k/t);yield 0;}}
function* charge(a,t,cols,r){for(let k=0;k<t;k+=G.dt){const h=handPos(a),an=Math.random()*6.283,d=rr(7,r||14);
  P(h.x+Math.cos(an)*d,h.y+Math.sin(an)*d,-Math.cos(an)*d*3,-Math.sin(an)*d*3,.3,pick(cols),Math.random()<.3?2:1);a.lean=-.15*(k/t);yield 0;}a.lean=.15;}
const FIRE=['#ff9f1c','#ff5a1f','#ffd166','#ffef9f','#c2261a'],WATER=['#74c0fc','#339af0','#ffffff','#a5d8ff'];

const STY={
 slash:function*(a,b,atk){yield* walkTo(a,reachX(a,b),120);yield* windup(a,.2,.3);
  a.lean=.35;a.x+=a.facing*5;a.sqv-=4;const c=center(b);
  slashFx(c.x-a.facing*8,c.y,a.facing,atk.color,16);slashFx(c.x-a.facing*4,c.y+2,a.facing,'#ffd166',11,true);

function updateFighter(f,dt){const o=other(f);f.px=f.x;f.t+=dt;if(f.flash>0)f.flash-=dt;

   case 'move':{const d=f.homeX-f.x,st=85*dt;if(Math.abs(d)<=st){f.x=f.homeX;f.oy=0;f.state=(G.over&&f===G.winner)?'victory':'idle';}

   case 'attack':runAttack(f,dt);break;

  if(G.introT>0)G.introT-=dt;if(G.callout){G.callout.life-=dt;if(G.callout.life<=0)G.callout=null;}
  for(const f of G.fighters)updateFighter(f,dt);
  if(!G.over&&G.introT<=0){const A=G.fighters[G.turn],B=G.fighters[1-G.turn];if(A.state==='idle'&&B.state==='idle'&&G.ents.length===0){G.turnDelay-=dt;if(G.turnDelay<=0)startAttack(A,B);}}
