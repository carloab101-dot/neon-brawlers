function buildSprite(d){
  const w=Math.max(...d.rows.map(r=>r.length)), h=d.rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  const f=document.createElement('canvas'); f.width=w; f.height=h; const fx=f.getContext('2d'); fx.fillStyle='#ffffff';
  d.rows.forEach((row,y)=>{for(let i=0;i<row.length;i++){const col=d.pal[row[i]]; if(!col) continue; x.fillStyle=col; x.fillRect(i,y,1,1); fx.fillRect(i,y,1,1);}});
  d.img=c; d.flashImg=f; d.w=w; d.h=h;
}

const G={match:0,fighters:[],ents:[],parts:[],texts:[],shake:0,flash:0,flashCol:'#fff',dim:0,dimT:0,over:false,overT:0,winner:null,
 turn:0,turnDelay:1.4,time:0,dt:0,slow:0,hitstop:0,round:1,introT:0,anim:{},rain:[],flies:[],leaves:[]};
window.__G=G;

function makeFighter(key,side){
  const c=CHARS[key], sp=SPR[c.spr];
  return {key,c,sp,side,facing:side===0?1:-1,x:0,y:GY,homeX:0,hp:100,disp:100,state:'idle',st:0,t:Math.random()*10,
    flash:0,vx:0,vy:0,oy:0,lift:0,rot:0,lean:0,sq:0,alpha:1,attack:null,lastAtk:-1,faceOverride:0,lockFace:false};
}
const other=f=>G.fighters[1-f.side];
const bodyH=f=>f.sp.h*f.sp.scale, bodyW=f=>f.sp.w*f.sp.scale;
const center=f=>({x:f.x,y:f.y+f.oy+f.lift-bodyH(f)/2});
function handPos(f){const s=f.sp,face=f.faceOverride||f.facing;return {x:f.x+face*(s.hand[0]+0.5-s.w/2)*s.scale,y:f.y+f.oy+f.lift-(s.h-s.hand[1]-0.5)*s.scale};}
function homes(){const d=Math.min(78,W*0.3);return [Math.round(W/2-d),Math.round(W/2+d)];}

function resetRound(newRound){
  const m=MATCHES[G.match];
  G.fighters=[makeFighter(m.a,0),makeFighter(m.b,1)];
  const h=homes(); G.fighters.forEach((f,i)=>{f.homeX=h[i];f.x=h[i];f.y=GY;});
  G.ents=[];G.parts=[];G.texts=[];G.over=false;G.overT=0;G.winner=null;G.dim=G.dimT=0;G.flash=0;G.shake=0;
  G.turn=Math.random()<.5?0:1;G.turnDelay=1.5;G.introT=1.5;
  if(newRound) G.round++; else G.round=1;
}
function setMatch(i){
  G.match=((i%4)+4)%4; buildBg(); resetRound(false);
  const n=(G.match+1)%4;
  document.getElementById('nl1').textContent='NEXT FIGHT \u25B6 ('+(n+1)+'/4)';
  document.getElementById('nl2').textContent='Up next: '+MATCHES[n].name;
}

// ================= particles / entities / text =================
function P(x,y,vx,vy,life,color,size,grav,drag){G.parts.push({x,y,vx,vy,life,max:life,color,size:size||1,grav:grav||0,drag:drag||0});}
function burst(x,y,cols,n,spd,size,grav){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*(spd||90);P(x,y,Math.cos(a)*s,Math.sin(a)*s-20,rr(.25,.65),pick(cols),Math.random()<.5?(size||2):Math.max(1,(size||2)-1),grav??150,2);}}
function smoke(x,y,n){for(let i=0;i<(n||26);i++)P(x+rr(-10,10),y+rr(-16,16),rr(-40,40),rr(-40,10),rr(.4,.8),pick(['#8a8aa0','#b0b0c4','#5a5a70','#d8d8e8']),(rr(3,6))|0,-25,2);}
function addText(text,x,y,color,life,size,vy,follow){G.texts.push({text,x,y,color,life,max:life,size,vy:vy||0,follow});}
function ent(e){e.t=0;e.dead=false;G.ents.push(e);return e;}
function pcirc(c,cx,cy,r,col){c.fillStyle=col;cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y)+0.3);c.fillRect(cx-w,cy+y,w*2+1,1);}}
function pline(c,x0,y0,x1,y1,col){c.fillStyle=col;const n=Math.max(1,Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0);for(let i=0;i<=n;i++)c.fillRect(Math.round(lerp(x0,x1,i/n)),Math.round(lerp(y0,y1,i/n)),1,1);}
function ring(c,cx,cy,r,col,th,sy){c.fillStyle=col;const n=Math.max(12,r*6|0);for(let i=0;i<n;i++){const a=i/n*Math.PI*2;c.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r*(sy||1)),th,th);}}
function star(c,x,y,col){c.fillStyle=col;x=Math.round(x);y=Math.round(y);c.fillRect(x-1,y,3,1);c.fillRect(x,y-1,1,3);}

function slashFx(x,y,dir,color,r,flipY){
  return ent({update(dt){this.t+=dt;return this.t<.24;},draw(){
    const k=this.t/.24,sw=Math.min(1,k*3),a0=-1.25,span=2.5;
    g.globalAlpha=k<.5?1:1-(k-.5)*2;
    for(let a=a0;a<a0+span*sw;a+=.05){const u=(a-a0)/span,th=1+Math.round(3*Math.sin(u*Math.PI));
      const px=x+Math.cos(a)*r*dir,py=y+Math.sin(a)*r*(flipY?-1:1);
      g.fillStyle=color;g.fillRect(Math.round(px)-(dir<0?th-1:0),Math.round(py),th,th);
      g.fillStyle='#ffffff';g.fillRect(Math.round(px),Math.round(py),1,1);}
    g.globalAlpha=1;}});
}
function ghost(f){const s=f.sp,x=f.x,y=f.y+f.oy,face=f.faceOverride||f.facing;
  ent({update(dt){this.t+=dt;return this.t<.25;},draw(){g.save();g.globalAlpha=.45*(1-this.t/.25);g.translate(Math.round(x),Math.round(y));g.scale(face,1);
    g.drawImage(s.img,-s.w*s.scale/2,-s.h*s.scale,s.w*s.scale,s.h*s.scale);g.restore();}});}

function hit(a,b,dmg,o){
  o=o||{}; if(b.state==='ko'||G.over) return;
  dmg=Math.max(1,Math.round(dmg*rr(.85,1.15)));
  b.hp=Math.max(0,b.hp-dmg); b.flash=.14; G.hitstop=.05;
  G.shake=Math.max(G.shake,o.shake||3);
  const c=center(b); burst(c.x,c.y,o.color||['#ffffff','#ffd166'],o.n||16,110,3,150);
  addText('-'+dmg,c.x+rr(-6,6),c.y-bodyH(b)/2-2,'#ffffff',.9,9,-28);
  const dir=Math.sign(b.x-a.x)||-b.facing, kb=(o.kb??70)*dir;
  if(b.hp<=0){b.state='ko';b.vx=kb*1.5;b.vy=-170;b.oy=-1;b.rot=0;b.lift=0;b.flash=.3;
    G.over=true;G.winner=a;G.overT=0;G.slow=.9;G.shake=10;G.flash=.35;G.flashCol='#ffffff';burst(c.x,c.y,['#fff','#ffd23f','#ff3b3b'],40,160,3,120);}
  else if(b.state!=='attack'){b.state='hit';b.st=.32;b.vx=kb;}
}

function shoot(a,b,o){
  const h=handPos(a),c=center(b);
  const e=Object.assign({x:h.x,y:h.y,sx:h.x,sy:h.y,tx:c.x+(o.dx||0),ty:c.y+(o.dy||0),ang:0,dir:Math.sign(c.x-h.x)||1},o);
  e.dur=Math.max(.12,Math.hypot(e.tx-e.sx,e.ty-e.sy)/o.speed);
  e.update=function(dt){this.t+=dt;const k=Math.min(1,this.t/this.dur),px=this.x,py=this.y;

function startAttack(a,b){
  const W8=[.4,.35,.25];let idx;
  do{let r=Math.random(),s=0;idx=0;for(let i=0;i<3;i++){s+=W8[i];if(r<s){idx=i;break;}}}while(idx===a.lastAtk);

  addText(atk.name.toUpperCase(),a.x,0,atk.color,1.5,idx===2?11:9,0,a);
}
function runAttack(a,dt){
  const A=a.attack; if(!A) return;
  if(A.wait>0){A.wait-=dt;if(A.wait>0)return;}
  if(A.until){if(!A.until())return;A.until=null;}
  const r=A.gen.next();
  if(r.done){finishAttack(a);return;}
  if(typeof r.value==='number')A.wait=r.value;else if(typeof r.value==='function')A.until=r.value;
}
function finishAttack(a){
  a.attack=null;a.lean=0;a.faceOverride=0;a.alpha=1;a.oy=0;a.lockFace=false;a.state='move';
  G.turn=Math.random()<.8?1-a.side:a.side;G.turnDelay=rr(.35,.8);
}

function updateFighter(f,dt){
  const o=other(f); f.t+=dt; if(f.flash>0)f.flash-=dt;
  if(f.state!=='ko'&&!f.lockFace)f.facing=o.x>=f.x?1:-1;
  f.sq*=Math.pow(.004,dt); f.disp=f.disp>f.hp?Math.max(f.hp,f.disp-dt*30):f.hp;
  switch(f.state){
   case 'idle':f.x=lerp(f.x,f.homeX+Math.sin(f.t*1.3+f.side*2)*3,Math.min(1,dt*3));f.oy=0;break;
   case 'move':{const d=f.homeX-f.x,st=90*dt;if(Math.abs(d)<=st){f.x=f.homeX;f.oy=0;f.state=(G.over&&f===G.winner)?'victory':'idle';}
     else{f.x+=Math.sign(d)*st;f.oy=f.sp.squishy?-Math.abs(Math.sin(f.t*9))*6:-Math.round(Math.abs(Math.sin(f.t*14))*2);}break;}
   case 'attack':runAttack(f,dt);break;
   case 'hit':f.st-=dt;f.x+=f.vx*dt;f.vx*=Math.pow(.02,dt);f.oy=0;if(f.st<=0)f.state='move';break;
   case 'ko':f.rot=Math.min(Math.PI/2,f.rot+dt*5);f.x+=f.vx*dt;f.vx*=Math.pow(.05,dt);f.vy+=520*dt;f.oy+=f.vy*dt;
     if(f.oy>0){f.oy=0;f.vy=Math.abs(f.vy)>40?-f.vy*.35:0;}break;
   case 'victory':f.oy=-Math.abs(Math.sin(f.t*6))*8;break;
  }
  if(f.state==='ko'){const hh=bodyH(f)*Math.sin(f.rot)+4;f.x=f.facing>0?clamp(f.x,hh,W-12):clamp(f.x,12,W-hh);}else f.x=clamp(f.x,12,W-12);
}
function update(dt){
  G.time+=dt; G.shake=Math.max(0,G.shake-dt*28); G.flash=Math.max(0,G.flash-dt); G.dim=lerp(G.dim,G.dimT,Math.min(1,dt*6));
  if(G.introT>0)G.introT-=dt;
  for(const f of G.fighters)updateFighter(f,dt);
  if(!G.over&&G.introT<=0){const A=G.fighters[G.turn],B=G.fighters[1-G.turn];
    if(A.state==='idle'&&B.state==='idle'&&G.ents.length===0){G.turnDelay-=dt;if(G.turnDelay<=0)startAttack(A,B);}}
  if(G.over){G.overT+=dt;const w=G.winner;if(w.state==='idle')w.state='victory';if(G.overT>3.6)resetRound(true);}
  const cur=G.ents;G.ents=[];for(const e of cur){if(e.update(dt))G.ents.push(e);else e.dead=true;}
  for(const p of G.parts){p.vy+=p.grav*dt;const dr=Math.max(0,1-p.drag*dt);p.vx*=dr;p.vy*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.life-=dt;t.y+=t.vy*dt;}
  G.texts=G.texts.filter(t=>t.life>0);
  updateBgAnim(dt);
}

   b.fillStyle='#ffffff';b.fillRect(x-2*s,y-6*s,1,1);b.fillRect(x+1*s,y-7*s,1,1);b.fillRect(x+2*s,y-5*s,1,1);};
  mush(Math.round(W*.14),GY+1,2);mush(Math.round(W*.18),GY+1,1);mush(Math.round(W*.86),GY+1,1);mush(Math.round(W*.5),GY+2,1);
  for(let i=0;i<16;i++){const x=R()*W|0;b.fillStyle=['#ffe066','#ff9ecf','#ffffff','#c77dff'][i%4];b.fillRect(x,GY-2,1,1);b.fillStyle='#3e8e3e';b.fillRect(x,GY-1,1,2);}
  b.fillStyle='#8a8f99';b.fillRect(Math.round(W*.62),GY-3,7,4);b.fillStyle='#a8adb8';b.fillRect(Math.round(W*.62)+1,GY-4,4,1);
 },
 // 3: pirate ship deck at sunset
 function(b,R){

  bands(b,hy,GY,['#2b5d8c','#245281','#1e4774','#193d66']);
  const ix=Math.round(W*.13);b.fillStyle='#3a2a4f';for(let dx=-28;dx<=28;dx++){const h=Math.round(9*Math.cos(dx/28*Math.PI/2));b.fillRect(ix+dx,hy-h,1,h);}
  b.fillRect(ix+4,hy-18,1,10);b.fillRect(ix,hy-19,9,1);b.fillRect(ix+1,hy-20,3,1);
  const mx=Math.round(W*.5);

  const skull=["..KKKKK..",".KKKKKKK.","KKKKKKKKK","KK..K..KK","KK..K..KK","KKKK.KKKK",".KKKKKKK.","..K.K.K..","K.......K",".K.....K.","..K...K..",".K.....K.","K.......K"];
  skull.forEach((row,y)=>{for(let i=0;i<row.length;i++)if(row[i]==='K'){b.fillStyle='#1a1418';b.fillRect(mx-9+i*2,28+y*2,2,2);}});

  full(b,GY-15,3,'#5c3a1c');full(b,GY-15,1,'#80532b');b.fillStyle='#5c3a1c';for(let x=-M;x<W+M;x+=14)b.fillRect(x,GY-12,3,12);full(b,GY,1,'#b88050');
  [.06,.94].forEach(p=>{const x=Math.round(W*p);b.fillStyle='#3a2410';b.fillRect(x-9,GY-19,18,21);b.fillStyle='#8b5a2b';b.fillRect(x-8,GY-18,16,19);b.fillStyle='#a8703a';b.fillRect(x-4,GY-18,4,19);

function buildBg(){
  bgc.width=W+2*M;bgc.height=H+2*M;bg=bgc.getContext('2d');bg.imageSmoothingEnabled=false;bg.setTransform(1,0,0,1,M,M);
  G.anim={};BG[MATCHES[G.match].theme](bg,mulberry(1234+G.match*77));
  G.rain=[];for(let i=0;i<90;i++)G.rain.push({x:Math.random()*(W+60),y:Math.random()*H,s:rr(220,300)});
  G.flies=[];for(let i=0;i<18;i++)G.flies.push({x:Math.random()*W,y:rr(40,GY-5),p:Math.random()*6});
  G.leaves=[];for(let i=0;i<14;i++)G.leaves.push({x:Math.random()*W,y:Math.random()*GY,p:Math.random()*6,c:pick(['#e89b3a','#d8533b','#7ed386'])});
}
function updateBgAnim(dt){
  const th=MATCHES[G.match].theme;
  if(th===1)for(const r of G.rain){r.y+=r.s*dt;r.x-=r.s*.25*dt;if(r.y>H){r.y=-5;r.x=Math.random()*(W+60);}}
  if(th===2){for(const f of G.flies){f.p+=dt;f.x+=Math.cos(f.p*.7)*8*dt;f.y+=Math.sin(f.p*1.1)*6*dt;}
   for(const l of G.leaves){l.p+=dt;l.y+=14*dt;l.x+=Math.sin(l.p*2)*12*dt;if(l.y>GY+10){l.y=-5;l.x=Math.random()*W;}}}
  if(th===0&&Math.random()<dt*8&&G.anim.torches){const x=pick(G.anim.torches);P(x+rr(-2,2),G.anim.wy+18,rr(-5,5),-rr(15,35),rr(.6,1.2),pick(['#ffb13b','#ff6a1f']),1,-5);}
}
function drawBgBack(){
  const th=MATCHES[G.match].theme,t=G.time;
  if(th===0&&G.anim.torches){for(const x of G.anim.torches){const y=G.anim.wy+18,fl=Math.sin(t*20+x)*1.2+Math.random()*1.2;
    g.globalAlpha=.18+.05*Math.sin(t*9+x);pcirc(g,x,y,15+fl,'#ffb13b');g.globalAlpha=1;pcirc(g,x,y+2,4+fl*.4,'#ff6a1f');pcirc(g,x,y+3,2.6,'#ffd166');g.fillStyle='#ffd166';g.fillRect(x,y-3-Math.round(fl),1,3);}}
  if(th===1&&G.anim.signs){for(const s of G.anim.signs){const on=!(Math.sin(t*37+s.x)>.93||((t+s.x)%5)<.12);if(!on)continue;
    g.globalAlpha=.22;g.fillStyle=s.c;g.fillRect(s.x-s.w/2-4,s.y-4,s.w+8,s.h+8);g.globalAlpha=1;g.fillStyle='#10061c';g.fillRect(s.x-s.w/2,s.y,s.w,s.h);
    g.fillStyle=s.c;g.fillRect(s.x-s.w/2,s.y,s.w,1);g.fillRect(s.x-s.w/2,s.y+s.h-1,s.w,1);g.fillRect(s.x-s.w/2,s.y,1,s.h);g.fillRect(s.x+s.w/2-1,s.y,1,s.h);
    g.fillStyle=s.c2;if(s.v){for(let i=0;i<4;i++){const yy=s.y+3+i*11;g.fillRect(s.x-3,yy,7,1);g.fillRect(s.x,yy,1,7);g.fillRect(s.x-3,yy+4,7,1);g.fillRect(s.x-2,yy+6,5,1);}}
    else{const L=s.x-s.w/2+3,y=s.y+3;g.fillRect(L,y,1,8);g.fillRect(L,y,4,1);g.fillRect(L,y+4,4,1);g.fillRect(L,y+7,4,1);g.fillRect(L+4,y+1,1,3);g.fillRect(L+4,y+5,1,2);
     g.fillRect(L+8,y+1,1,7);g.fillRect(L+12,y+1,1,7);g.fillRect(L+9,y,3,1);g.fillRect(L+9,y+4,3,1);
     g.fillRect(L+16,y,1,8);g.fillRect(L+16,y,4,1);g.fillRect(L+16,y+4,4,1);g.fillRect(L+20,y+1,1,3);g.fillRect(L+19,y+5,1,1);g.fillRect(L+20,y+6,1,2);
     g.fillStyle='#ffe066';for(let k=0;k<3;k++)g.fillRect(L+24+k*2,y+3,1,1);}}}
  if(th===2){g.globalAlpha=.08;g.fillStyle='#fffbe0';for(let i=0;i<4;i++){const x0=W*(.2+i*.22)+Math.sin(t*.3+i)*6;g.beginPath();g.moveTo(x0,-M);g.lineTo(x0+10,-M);g.lineTo(x0-30,GY);g.lineTo(x0-50,GY);g.fill();}g.globalAlpha=1;}
  if(th===3){const hy=GY-54;for(let y=hy+3;y<GY-16;y+=4){const off=(t*(8+y%7)*((y/4)%2?1:-1))%24;g.fillStyle=y<hy+14?'#5d8fbf':'#3f73a6';for(let x=-24+off;x<W+24;x+=24)g.fillRect(Math.round(x+(y*7)%11),y,5,1);}
    const sx=Math.round(W*.74);for(let y=hy+2;y<GY-16;y+=3){if(Math.sin(t*6+y)>0){g.fillStyle='#ffe9b0';g.fillRect(sx-6+Math.round(Math.sin(t*3+y)*3),y,10-(y-hy)/5|0,1);}}
    g.fillStyle='#2a1a2a';for(let i=0;i<3;i++){const x=((t*(12+i*5)+i*97)%(W+40))-20,y=26+i*9+Math.sin(t*2+i)*3,f=Math.sin(t*10+i)>0;g.fillRect(Math.round(x)-2,Math.round(y)-(f?1:0),2,1);g.fillRect(Math.round(x)+1,Math.round(y)-(f?1:0),2,1);g.fillRect(Math.round(x),Math.round(y),1,1);}}
}
function drawBgFront(){
  const th=MATCHES[G.match].theme,t=G.time;
  if(th===1){g.fillStyle='#8fb8ff';g.globalAlpha=.45;for(const r of G.rain){g.fillRect(Math.round(r.x),Math.round(r.y),1,4);}g.globalAlpha=1;}
  if(th===2){for(const f of G.flies){if(Math.sin(G.time*3+f.p*5)>0){g.fillStyle='#fff27a';g.fillRect(Math.round(f.x),Math.round(f.y),1,1);g.globalAlpha=.3;g.fillRect(Math.round(f.x)-1,Math.round(f.y)-1,3,3);g.globalAlpha=1;}}
   for(const l of G.leaves){g.fillStyle=l.c;g.fillRect(Math.round(l.x),Math.round(l.y),2,1);g.fillRect(Math.round(l.x)+(Math.sin(l.p*3)>0?1:0),Math.round(l.y)+1,1,1);}}
}

// ================= render =================
function drawFighter(f){
  if(f.alpha<=0)return;
  const s=f.sp,w=s.w*s.scale,h=s.h*s.scale;let bob=0,sx=1,sy=1;
  if(f.state==='idle'){if(s.squishy){const k=Math.sin(f.t*5)*.06;sx=1+k;sy=1-k;}else bob=Math.round(Math.sin(f.t*4));}
  sx*=1+f.sq;sy*=1-f.sq;
  g.save();g.globalAlpha=f.alpha;g.translate(Math.round(f.x),Math.round(f.y+f.oy+f.lift+bob-Math.sin(f.rot)*w/2));
  g.scale((f.faceOverride||f.facing)*sx,sy);g.rotate(f.lean-f.rot);
  g.drawImage(f.flash>0?s.flashImg:s.img,-w/2,-h,w,h);g.restore();
}
function drawShadow(f){const w=bodyW(f)*.7*(1+Math.min(0,f.oy+f.lift)/60),x=Math.round(f.x);g.fillStyle='rgba(0,0,0,.35)';
  g.fillRect(Math.round(x-w/2),GY-1,Math.round(w),3);g.fillRect(Math.round(x-w/2+2),GY-2,Math.round(w-4),5);}
function render(){
  g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=false;g.globalAlpha=1;
  const shx=G.shake>0?Math.round(rr(-G.shake,G.shake)):0,shy=G.shake>0?Math.round(rr(-G.shake,G.shake)):0;
  g.translate(shx,shy);g.drawImage(bgc,-M,-M);
  drawBgBack();
  if(G.dim>.01){g.fillStyle='rgba(5,0,15,'+G.dim.toFixed(3)+')';g.fillRect(-M,-M,W+2*M,H+2*M);}
  G.fighters.forEach(drawShadow);
  const fs=G.fighters.slice().sort((a,b)=>(a.state==='attack')-(b.state==='attack'));fs.forEach(drawFighter);
  for(const e of G.ents)if(e.draw)e.draw(e);
  for(const p of G.parts){g.globalAlpha=Math.min(1,p.life/p.max*1.5);g.fillStyle=p.color;g.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);}g.globalAlpha=1;
  drawBgFront();
  g.setTransform(1,0,0,1,0,0);
  if(G.flash>0){g.globalAlpha=Math.min(.6,G.flash*2);g.fillStyle=G.flashCol;g.fillRect(0,0,W,H);g.globalAlpha=1;}
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(buf,0,0,W,H,0,0,W*SC,H*SC);
  drawUI();
}
function txt(s,x,y,size,col,align,outline){ctx.font='bold '+Math.round(size)+'px "Courier New",Courier,monospace';ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=Math.max(2,size/4);ctx.strokeStyle=outline||'#000';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function drawUI(){
  const cw=cv.width,ch=cv.height,u=SC,m=MATCHES[G.match];
  const title='FIGHT '+(G.match+1)+'/4: '+m.name.toUpperCase(),btnW=(document.getElementById('next').offsetWidth+30)*DPR;
  let ts=Math.max(5.5*u,13*DPR),tx=cw/2,ta='center';
  if(cw/2+title.length*ts*.31>cw-btnW){tx=14*DPR;ta='left';ts=Math.min(ts,(cw-btnW-20*DPR)/(title.length*.62));}
  txt(title,tx,Math.max(7*u,18*DPR),ts,'#ffffff',ta);
  txt('ROUND '+G.round,tx,Math.max(14*u,34*DPR)+(ta==='left'?Math.max(0,ts-13*DPR):0),Math.max(4*u,10*DPR),'#ffd23f',ta);
  const by=Math.max(27*u,112*DPR),bw=cw*.36,bh=Math.max(4.5*u,10*DPR);
  G.fighters.forEach((f,i)=>{const x=i===0?cw*.04:cw*.96-bw;
    txt(f.c.name,i===0?x:x+bw,by-bh*.9,Math.max(4.2*u,11*DPR),f.c.color,i===0?'left':'right');
    ctx.fillStyle='#000';ctx.fillRect(x-3,by-3,bw+6,bh+6);ctx.fillStyle='#3a0d12';ctx.fillRect(x,by,bw,bh);
    const dw=bw*f.disp/100,hw=bw*f.hp/100,hp=f.hp/100,col=hp>.5?'#3ddc5a':hp>.25?'#ffd23f':'#ff3b3b';
    ctx.fillStyle='#ffffff';if(i===0)ctx.fillRect(x,by,dw,bh);else ctx.fillRect(x+bw-dw,by,dw,bh);
    ctx.fillStyle=col;if(i===0)ctx.fillRect(x,by,hw,bh);else ctx.fillRect(x+bw-hw,by,hw,bh);
    ctx.fillStyle='rgba(255,255,255,.35)';if(i===0)ctx.fillRect(x,by,hw,bh*.3);else ctx.fillRect(x+bw-hw,by,hw,bh*.3);
    txt(Math.ceil(f.hp)+' HP',i===0?x:x+bw,by+bh*2.1,bh*.9,'#ffffff',i===0?'left':'right');
  });
  for(const t of G.texts){let x=t.x,y=t.y;if(t.follow){x=t.follow.x;y=t.follow.y-bodyH(t.follow)-20;}
    const a=Math.min(1,t.life/t.max*3),pop=1+Math.max(0,(t.life-t.max+.12))*3;ctx.globalAlpha=a;
    txt(t.text,clamp(x*u,60*DPR,cw-60*DPR),y*u,t.size*u*.9*pop,t.color);ctx.globalAlpha=1;}
  if(G.introT>0){const s=G.introT>.6?'ROUND '+G.round:'FIGHT!';txt(s,cw/2,ch*.42,16*u*(1+Math.max(0,G.introT-1.3)*2),G.introT>.6?'#ffffff':'#ffd23f');}
  if(G.over){const k=G.overT;const sh=k<.6?rr(-4,4)*u*.3:0;
    txt('K.O.!',cw/2+sh,ch*.36,Math.min(26*u,cw*.18)*(k<.2?1+(.2-k)*4:1),'#ff3b3b','center','#ffe066');
    if(k>.8){txt(G.winner.c.name+' WINS!',cw/2,ch*.5,Math.min(10*u,cw*.06),G.winner.c.color);
      txt('Next round in '+Math.max(1,Math.ceil(3.6-k)),cw/2,ch*.58,Math.max(4.5*u,11*DPR),'#ffffff');}}
  txt('Keys 1-4: pick fight   Button: next fight',cw/2,ch-Math.max(5*u,12*DPR),Math.max(3.4*u,10*DPR),'rgba(255,255,255,.75)');
}

// ================= resize & loop =================
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR);
  SC=cv.height/BH;W=Math.ceil(cv.width/SC);H=BH;GY=BH-34;buf.width=W;buf.height=H;
  buildBg();const h=homes();
  G.fighters.forEach((f,i)=>{const dx=f.x-f.homeX;f.homeX=h[i];f.x=clamp(h[i]+dx,12,W-12);f.y=GY;});
}
window.addEventListener('resize',resize);
document.getElementById('next').addEventListener('click',e=>{setMatch(G.match+1);e.currentTarget.blur();});
window.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')setMatch(+e.key-1);else if(e.key==='ArrowRight'||e.key==='n'||e.key==='N')setMatch(G.match+1);});
resize();setMatch(0);
let last=performance.now();
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.hitstop>0){G.hitstop-=dt;dt=0;}else if(G.slow>0){G.slow-=dt;dt*=.35;}
  G.dt=dt;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
