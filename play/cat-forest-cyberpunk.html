<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Forest: Cyberpunk — four neon remixes of the cat duel</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

<!-- Sakura Tora vs Count Mochi on an isometric turn-based tile board, as cyberpunk remixes of the four Cat Forest versions.
     Keys 1-4 pick a version; the top-right button cycles. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#c{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:1}
#next{position:fixed;top:14px;right:14px;z-index:20;cursor:pointer;text-align:right;line-height:1.25;user-select:none;padding:9px 15px;transition:transform .12s}
#next small{display:block;font-size:13px;opacity:.95;margin-top:2px}
#next.xwood{font:700 16px "Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;letter-spacing:2px;background:#1b2147;color:#f1e4c4;border:3px solid #0d0f22;border-radius:3px;box-shadow:inset 0 0 0 3px #1b2147,inset 0 0 0 5px #ff3d9a,4px 4px 0 #3cf6ff}
#next.xwood small{color:#3cf6ff;font-weight:700}
#next.xwood:hover{background:#26306a}
#next.xmanga{font:italic 900 17px "Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:1px;background:#0d0b1a;color:#fff;border:3px solid #3cf6ff;border-radius:2px;box-shadow:5px 5px 0 #ff2a6d,0 0 14px rgba(60,246,255,.6);transform:skewX(-6deg);text-shadow:2px 0 0 #ff2a6d}
#next.xmanga small{font:italic 800 12px Arial,sans-serif;color:#3cf6ff}
#next.xmanga:hover{background:#1c1838}
#next.xink{font:700 19px "Segoe Print","Bradley Hand","Comic Sans MS",Caveat,Kalam,cursive;background:#ece6d8;color:#1c1a17;border:2.5px solid #1c1a17;
 border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:3px 4px 0 rgba(255,42,160,.45),-3px -2px 0 rgba(60,246,255,.45);transform:rotate(-2deg)}
#next.xink small{font-size:14px;color:#c2187a}
#next.xink:hover{transform:rotate(1deg) scale(1.04)}
#next.xcard{font:700 15px Orbitron,"Segoe UI",Consolas,monospace;letter-spacing:2px;background:rgba(10,6,28,.8);color:#3cf6ff;border:1.5px solid #3cf6ff;border-radius:10px;
 box-shadow:0 0 12px rgba(60,246,255,.6),inset 0 0 12px rgba(255,42,109,.35);padding:9px 15px 9px 38px;text-shadow:0 0 6px #3cf6ff}
#next.xcard::before{content:'\2660';position:absolute;left:12px;top:8px;font-size:22px;color:#ff2a6d;text-shadow:0 0 8px #ff2a6d}
#next.xcard small{color:#ff2a6d;text-shadow:0 0 6px #ff2a6d;font-size:12px}
#next.xcard:hover{transform:translateY(-3px)}
#next:active{transform:translateY(3px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="next" class="xwood" title="Switch version (keys 1-4)"><span id="nl1">NEXT VERSION</span><small id="nl2">Up next</small></button>
<script>
'use strict';
// ================= CORE =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let DPR=1;
const rr=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,k)=>a+(b-a)*k,clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[(Math.random()*a.length)|0];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const easeOutBack=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
const easeOutElastic=k=>k<=0?0:k>=1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*2*Math.PI/3)+1;
const INK='#1c1a17',OUT='#1d1b2a';
const FONT_INK='"Segoe Print","Bradley Hand","Comic Sans MS",Caveat,Kalam,cursive';
const easeInOut=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
// ================= CATS & VERSIONS =================
const TORA='Sakura Tora',MOCHI='Count Mochi';
const CHARS={
 toraA:{name:TORA,kind:'tabby',idx:'1',attacks:[{name:'Neon Sleeve Slash',dmg:12,k:'claw'},{name:'Hologram Hanami',dmg:12,k:'petal'},{name:'Circuit Fan Gale',dmg:16,k:'gust'}]},
 mochiA:{name:MOCHI,kind:'white',idx:'A',attacks:[{name:'Monocle Laser',dmg:15,k:'beam'},{name:'Firewall Flourish',dmg:14,k:'swirl'},{name:'Virus Ace',dmg:11,k:'cards'}]},
 toraB:{name:TORA,kind:'tabby',idx:'1',attacks:[{name:'Plasma Claw',dmg:12,k:'claw'},{name:'Datastorm Petals',dmg:12,k:'petal'},{name:'Neon Katana Dash',dmg:16,k:'gust'}]},
 mochiB:{name:MOCHI,kind:'white',idx:'A',attacks:[{name:'HUD Lock-On Laser',dmg:15,k:'beam'},{name:'Blackout Mantle',dmg:14,k:'swirl'},{name:'Hack Card',dmg:11,k:'cards'}]},
 toraC:{name:TORA,kind:'tabby',idx:'1',attacks:[{name:'Glitch Scratch',dmg:12,k:'claw'},{name:'Pixel Petal Scribble',dmg:12,k:'petal'},{name:'Overclock Brush Gust',dmg:16,k:'gust'}]},
 mochiC:{name:MOCHI,kind:'white',idx:'A',attacks:[{name:'Rusted Monocle Ray',dmg:15,k:'beam'},{name:'Static Coat Swirl',dmg:14,k:'swirl'},{name:'Corrupted Card Toss',dmg:11,k:'cards'}]},
 toraD:{name:TORA,kind:'tabby',idx:'1',attacks:[{name:'Neon Paper Cut',dmg:12,k:'claw'},{name:'Holo Shuffle',dmg:12,k:'petal'},{name:'Royal Flush.exe',dmg:16,k:'gust'}]},
 mochiD:{name:MOCHI,kind:'white',idx:'A',attacks:[{name:'LED Spade Beam',dmg:15,k:'beam'},{name:'Full House Firewall',dmg:14,k:'swirl'},{name:'Ace.virus',dmg:11,k:'cards'}]}
};
const MATCHES=[
 {name:'Cyberpunk Woodblock Print',a:'toraA',b:'mochiA',cls:'xwood',genre:'neon ukiyo-e megacity'},
 {name:'Cyberpunk Manga',a:'toraB',b:'mochiB',cls:'xmanga',genre:'neon rooftop, anime lineart'},
 {name:'Cyberpunk Ink Sketch',a:'toraC',b:'mochiC',cls:'xink',genre:'overgrown cyber ruins in ink'},
 {name:'Cyberpunk Card Duel',a:'toraD',b:'mochiD',cls:'xcard',genre:'neon casino table in a cyber alley'}
];
// ================= SHARED ROUND STATE =================
// Every mode owns its own world/physics/camera; this only tracks HP, turns, KO and restart.
const R={match:0,round:1,time:0,over:false,overT:0,winner:null,loser:null,fighters:[],callout:null,texts:[],introT:0,hitstop:0};
function mkF(key,side){return {key,c:CHARS[key],side,hp:100,disp:100,flash:0,lastAtk:-1,atk:null,cd:.8+side*.9};}
function newRound(inc){if(inc)R.round++;R.over=false;R.overT=0;R.winner=R.loser=null;R.callout=null;R.texts=[];R.introT=1.1;
  const m=MATCHES[R.match];R.fighters=[mkF(m.a,0),mkF(m.b,1)];}
function foe(f){return R.fighters[1-f.side];}
function pickAttack(f){if(R.force&&R.force[f.side]!=null){const i=R.force[f.side];R.force[f.side]=null;f.lastAtk=i;return i;}const Wt=[.42,.35,.23];let i;do{let r=Math.random();i=r<Wt[0]?0:r<Wt[0]+Wt[1]?1:2;}while(i===f.lastAtk&&Math.random()<.75);
  f.lastAtk=i;return i;}
function announce(f,i){const a=f.c.attacks[i];R.callout={side:f.side,text:a.name,life:1.8,max:1.8,special:i===2};}
// damage(a,b,dmg,info) -> true if applied. Modes pass world position for the floating number.
function damage(a,b,dmg,pos){if(R.over||b.hp<=0)return false;dmg=Math.round(dmg);b.hp=Math.max(0,b.hp-dmg);b.flash=.16;
  const tk=dmg<5&&R.texts.find(t=>t.target===b&&t.tick&&t.life>t.max-.8);
  if(tk){tk.sum+=dmg;tk.text='-'+tk.sum;tk.life=tk.max;Object.assign(tk,pos||{});}
  else{const stack=R.texts.filter(t=>t.target===b&&t.life>t.max-.55).length;
  R.texts.push(Object.assign({text:'-'+dmg,target:b,life:1.1,max:1.1,stack,big:dmg>=15,tick:dmg<5,sum:dmg},pos||{}));}
  R.hitstop=Math.max(R.hitstop,dmg>=15?.09:.05);
  if(b.hp<=0){R.over=true;R.overT=0;R.winner=a;R.loser=b;R.callout=null;if(MODE.onKO)MODE.onKO(b,a);}
  return true;}
function updateRound(dt){R.time+=dt;if(R.introT>0)R.introT-=dt;
  for(const f of R.fighters){if(f.flash>0)f.flash-=dt;f.disp+=(f.hp-f.disp)*Math.min(1,dt*(f.disp>f.hp?2.2:8));}
  for(const t of R.texts)t.life-=dt;R.texts=R.texts.filter(t=>t.life>0);
  if(R.callout){R.callout.life-=dt;if(R.callout.life<=0)R.callout=null;}
  if(R.over){R.overT+=dt;if(R.overT>3.6){newRound(true);MODE.reset();}}}
const canAct=()=>!R.over&&R.introT<=0;

// ================= MODE REGISTRY / LOOP =================
const MODES=[];let MODE=null,last=performance.now(),rafId=0;
const btn=document.getElementById('next');
function setMatch(i){const NM=MATCHES.length;i=((i%NM)+NM)%NM;if(MODE&&MODE.dispose)MODE.dispose();R.match=i;R.round=1;newRound(false);
  MODE=MODES[i];cv.style.display=MODE.is3D?'none':'block';MODE.init();MODE.reset();
  const n=MATCHES[(i+1)%NM];btn.className=MATCHES[i].cls;
  document.getElementById('nl1').textContent='NEXT VERSION ('+((i+1)%NM+1)+'/'+NM+')';
  document.getElementById('nl2').textContent=n.name;btn.title='Now: '+MATCHES[i].name+' ('+(i+1)+'/'+NM+'). Next: '+n.name+' \u2014 keys 1-'+NM+' also switch';}
btn.addEventListener('click',e=>{e.stopPropagation();setMatch(R.match+1);btn.blur();});
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<=String(MATCHES.length))setMatch(+e.key-1);});
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR);if(MODE&&MODE.resize)MODE.resize();}
addEventListener('resize',resize);
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;
  if(R.hitstop>0){R.hitstop-=dt;dt*=.08;}
  try{MODE.update(dt);updateRound(dt);MODE.render();}catch(err){console.error(err);}
  rafId=requestAnimationFrame(frame);}
// test/debug hook
Object.defineProperty(window,'__G',{get(){return {match:R.match,round:R.round,over:R.over,intro:R.introT>0,
  f:R.fighters.map(f=>({name:f.c.name,hp:f.hp,atk:f.atk?f.c.attacks[f.atk.i].name:null,atkT:f.atk?f.atk.t:0})),fx:MODE&&MODE.fxCount?MODE.fxCount():0,ver:MATCHES[R.match].name,
  three:!!(MODE&&MODE.renderer),info:MODE&&MODE.debug?MODE.debug():null};}});

let C=ctx;
let inkS=1;function jr(){inkS=(Math.imul(inkS,1103515245)+12345)&0x7fffffff;return inkS/0x7fffffff;}
function circPts(x,y,rx,ry,n){const o=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;o.push(x+Math.cos(a)*rx,y+Math.sin(a)*ry);}return o;}
function iPath(pts,closed,w,col,amp){amp=amp===undefined?.45:amp;C.lineCap='round';C.lineJoin='round';C.strokeStyle=col||INK;
  for(let pass=0;pass<2;pass++){C.beginPath();for(let i=0;i<pts.length;i+=2){const x=pts[i]+(jr()-.5)*amp*2,y=pts[i+1]+(jr()-.5)*amp*2;if(i)C.lineTo(x,y);else C.moveTo(x,y);}
   if(closed)C.closePath();C.lineWidth=(w||.6)*(pass?.5:1);C.stroke();}}
function wash(pts,col,al,amp){amp=amp===undefined?.7:amp;C.save();C.globalAlpha*=al===undefined?.4:al;C.fillStyle=col;C.beginPath();
  for(let i=0;i<pts.length;i+=2){const x=pts[i]+(jr()-.5)*amp*2+.6,y=pts[i+1]+(jr()-.5)*amp*2+.5;if(i)C.lineTo(x,y);else C.moveTo(x,y);}C.closePath();C.fill();C.restore();}
const flat=pts=>{const o=[];for(const p of pts)o.push(p[0],p[1]);return o;};
function inkSeed(base){inkS=((base*9301)+Math.floor(R.time*8)*49297+17)&0x7fffffff;}
// =====================================================================
//  THE TWO CATS — geometry is shared (that's the likeness); each version renders it differently
//  Local coords: feet at (0,0), up is -y, ~66 units tall, drawn facing "right" (flip with scale(-1,1)).
// =====================================================================
function E(cx,cy,rx,ry,n){n=n||16;const o=[];for(let i=0;i<n;i++){const a=i/n*6.2832;o.push(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry);}return o;}
function rotP(pts,cx,cy,a){if(!a)return pts;const c=Math.cos(a),s=Math.sin(a),o=[];for(let i=0;i<pts.length;i+=2){const x=pts[i]-cx,y=pts[i+1]-cy;o.push(cx+x*c-y*s,cy+x*s+y*c);}return o;}
function offP(pts,dx,dy){const o=[];for(let i=0;i<pts.length;i+=2)o.push(pts[i]+dx,pts[i+1]+dy);return o;}
function ribbon(center,widths){const L=[],Rr=[];for(let i=0;i<center.length;i++){const a=center[Math.max(0,i-1)],b=center[Math.min(center.length-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,w=widths[i];
  L.push([center[i][0]+nx*w,center[i][1]+ny*w]);Rr.push([center[i][0]-nx*w,center[i][1]-ny*w]);}return {L,R:Rr};}
const flatten=a=>{const o=[];for(const p of a)o.push(p[0],p[1]);return o;};
let CYF=null;function flowerParts(out,x,y,r,petal,center,lw){for(let k=0;k<5;k++){const a=k/5*6.283-1.57;out.push({pts:E(x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.5,r*.5,8),fill:CYF?'rgba(0,0,0,0)':petal,lw:lw==null?.35:lw,glow:CYF?(petal===CAT_PAL.tabby.sakura||petal==='#f4b3c2'?CYF.c2:CYF.c1):null});}out.push({pts:E(x,y,r*.3,r*.3,6),fill:center,lw:0});}
// palette per version can override these
const CAT_PAL={
 tabby:{fur:'#ecd6b2',furD:'#3a2416',mask:'#4a2d1a',cheek:'#8a5a36',muzzle:'#f8ecd4',earIn:'#d8ae88',tailBand:'#9b6a42',eye:'#b9b24a',
  navy:'#233a67',red:'#b8322a',lining:'#d6453a',cream:'#f1dfb5',gold:'#c99a3a',pink:'#e98aa6',sakura:'#f4b3c2',leg:'#2e1d12'},
 white:{fur:'#f8f6f1',furS:'#dcd8d0',earIn:'#f2a8a2',eye:'#d9a441',coat:'#18181e',coatH:'#34343f',fur2:'#0b0b0e',furT:'#4a4a56',silver:'#c9ced8',lens:'#cfe9f5',cravat:'#f4f4f4',shoe:'#111'}
};
function headScale(out,h0,k,py){if(!k||k===1)return;for(let i=h0;i<out.length;i++){const a=out[i].pts;for(let j=0;j<a.length;j+=2){a[j]*=k;a[j+1]=py+(a[j+1]-py)*k;}}}
function tabbyParts(P,pal){pal=pal||CAT_PAL.tabby;const t=P.t,B=P.bob||0,hs=Math.sin(t*2.1)*.8,out=[];const add=(pts,fill,o)=>out.push(Object.assign({pts,fill},o||{}));
 const CY=P.cyber?P.cy:null;
 if(CY){// katana slung across the back (hilt peeks over the right shoulder)
  add([-14,-13+B,-11.5,-11.5+B,14,-53+B,11.5,-54.5+B],'#15151f',{lw:.8});add([-12.6,-12.4+B,12.8,-53.6+B],null,{open:true,lw:.5,glow:CY.c2});
  add(E(12.6,-53.8+B,2.6,1.3,10),'#c9a13b',{lw:.6});add([12,-55+B,14.5,-56.5+B,18.5,-62.5+B,16,-64+B],'#1a1a24',{lw:.7});for(let k=0;k<3;k++){const u=k/3;add([13.3+u*4.2,-56.8+B-u*6,15.3+u*4.2,-56.6+B-u*6],null,{open:true,lw:.35,glow:CY.c1});}}
 // --- bushy striped tail (behind) ---
 const sway=Math.sin(t*2.2)*.22+(P.tail||0),C1=[],Wd=[];
 for(let i=0;i<=12;i++){const s=i/12;C1.push([-7-19*Math.sin(s*1.7)+6*s*s*s+sway*12*s*s,-14-34*s+B*s]);Wd.push(1.8+5.2*Math.sin(Math.pow(s,.8)*Math.PI*.92)*(1-s*.25));}
 const rb=ribbon(C1,Wd);add(flatten(rb.L.concat(rb.R.slice().reverse())),pal.furD,{lw:1.1,shade:true});
 for(let i=1;i<11;i+=2){add(flatten([rb.L[i],rb.L[i+1],rb.R[i+1],rb.R[i]]),pal.tailBand,{lw:0});if(CY){const m=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2],u=m(rb.L[i],rb.L[i+1]),w=m(rb.R[i],rb.R[i+1]);add([u[0],u[1],w[0],w[1]],null,{open:true,lw:.45,glow:CY.c2});}}
 // --- back sleeve (viewer's left) ---
 const bs=[-9,-36+B,-18,-31+B,-22.5,-23+B,-21.5,-13+B+hs,-15,-10+B+hs,-12,-19+B,-9,-27+B];add(bs,pal.navy,{shade:true});
 add([-21.5,-13+B+hs,-15,-10+B+hs,-15.4,-12.6+B+hs,-21.4,-15.8+B+hs],CY?CY.c2:pal.lining,{lw:.5,glow:CY&&CY.c2});if(CY)add([-19.5,-26+B,-16,-28+B,-12,-28+B,-11,-31+B],null,{open:true,lw:.4,glow:CY.c1});flowerParts(out,-17,-22+B,2.6,pal.cream,pal.gold);
 add(E(-23.5,-21+B,3,3.2,10),pal.muzzle,{lw:.9});
 // --- legs & feet ---
 add([-7.5,-7,-2.5,-7,-2.8,-2,-7.2,-2],pal.leg,{lw:.7});add([2.5,-7,7.5,-7,7.2,-2,2.8,-2],pal.leg,{lw:.7});
 add(E(-5,-1.6,4.6,2.4,12),pal.muzzle,{lw:.8});add(E(5.2,-1.6,4.6,2.4,12),pal.muzzle,{lw:.8});
 // --- kimono ---
 add([-10,-37+B,10,-37+B,12.5,-5+hs,-12.5,-5+hs],pal.navy,{shade:true,tone:true});
 add([2,-36+B,10,-37+B,12.5,-5+hs,3,-5+hs],pal.red,{lw:.8,shade:true});
 add([2,-5+hs,3.2,-5+hs,2.4,-24+B,1.6,-24+B],pal.cream,{lw:.4});
 flowerParts(out,-6.5,-11+hs,2.8,pal.cream,pal.gold);flowerParts(out,-5,-31+B,2,pal.cream,pal.gold);flowerParts(out,7.5,-11+hs,2.6,pal.sakura,pal.gold);flowerParts(out,7,-31.5+B,1.9,pal.sakura,pal.gold);flowerParts(out,9,-19+B,1.6,pal.cream,pal.red);
 if(CY){const tr=[[-10,-8+hs,-7,-8+hs,-7,-14,-4,-17],[-9,-33+B,-9,-29+B,-5,-29+B,-3,-26.5+B],[-11,-15,-8.5,-15,-8.5,-19],[5,-6+hs,5,-10,8.5,-13.5,11,-13.5],[4,-34+B,7,-34+B,7,-28+B,10,-28+B],[-1,-6+hs,-1,-11,1,-13]];
  for(const t of tr){add(t,null,{open:true,lw:.35,glow:CY.c1});add(E(t[t.length-2],t[t.length-1],.55,.55,6),CY.c1,{lw:0,glow:CY.c1});}
  add([-12.5,-5+hs,12.5,-5+hs],null,{open:true,lw:.45,glow:CY.c2});}
 // collar
 add([-4.5,-37.5+B,-2.6,-37.5+B,1,-27.5+B,-.4,-26.8+B],pal.cream,{lw:.5});add([4.5,-37.5+B,2.6,-37.5+B,-.6,-27.5+B,.6,-26.8+B],pal.cream,{lw:.5});
 add([-6.6,-37+B,-4.5,-37.5+B,-.4,-26.8+B,-1.6,-26+B],pal.red,{lw:.5});add([6.6,-37+B,4.5,-37.5+B,.6,-26.8+B,1.6,-26+B],pal.red,{lw:.5});
 // obi: pink band + gold sash + knotted cord

function reachable(f,steps){const p=f.p,o=foe(f),res={};res[tkey(p.gx,p.gy)]=[[p.gx,p.gy]];let fr=[[p.gx,p.gy]];
 for(let s=0;s<steps;s++){const nf=[];for(const [x,y] of fr)for(const [dx,dy] of N4){const nx=x+dx,ny=y+dy,k=tkey(nx,ny);if(res[k]||!free(nx,ny,f)||(o.p.gx===nx&&o.p.gy===ny))continue;res[k]=res[tkey(x,y)].concat([[nx,ny]]);nf.push([nx,ny]);}fr=nf;}return res;}
function req(k,x,y,tx,ty){const dx=tx-x,dy=ty-y,md=Math.abs(dx)+Math.abs(dy),al=dx===0||dy===0;
 if(k==='claw')return md===1?0:10+md;if(k==='petal'||k==='swirl')return md>=2&&md<=4?0:5+Math.abs(md-3);if(k==='cards')return md>=2&&md<=5?0:5+Math.abs(md-3);
 return al&&md>=2?0:6+Math.min(Math.abs(dx),Math.abs(dy))*3;}
function planMove(f,i){const q=foe(f).p,rs=reachable(f,2),k=f.c.attacks[i].k;let best=null,bs=1e9;
 for(const key in rs){const [x,y]=rs[key][rs[key].length-1],sc=req(k,x,y,q.gx,q.gy)*10+rs[key].length*.6+Math.random()*1.2;if(sc<bs){bs=sc;best=rs[key];}}
 const e=best[best.length-1];return {path:best,ok:req(k,e[0],e[1],q.gx,q.gy)===0,reach:rs};}
function startHop(p,tx,ty,dur,h){p.anim={fx:p.x,fy:p.y,tx,ty,t:0,dur,h};p.gx=tx;p.gy=ty;}
function* hopG(p,tx,ty,dur,h){startHop(p,tx,ty,dur,h);while(p.anim)yield 0;}
function* telegraph(f,o,tiles,col,dur){CB.pattern=tiles;CB.patCol=col;CB.patT=0;let dodged=false;
 for(let t=0;t<dur;t+=DT){CB.patT=t/dur;const q=o.p;
  if(!dodged&&t>dur*.45){dodged=true;const on=tiles.some(([x,y])=>x===q.gx&&y===q.gy);
   if(on&&Math.random()<.33){const opts=N4.map(([dx,dy])=>[q.gx+dx,q.gy+dy]).filter(([x,y])=>free(x,y,o)&&!tiles.some(([a,b])=>a===x&&b===y));
    if(opts.length){const [x,y]=pick(opts);startHop(q,x,y,.28,16);const sp=isoP(x,y);CB.miss.push({text:CB.T.words.dodge,x:sp.x,y:sp.y-80,life:1.5,max:1.5});}}}
  yield 0;}}
const onTiles=(p,tiles)=>tiles.some(([x,y])=>x===p.gx&&y===p.gy);
function splat(x,y,col,big){const drops=[];for(let i=0;i<(big?18:12);i++){const a=Math.random()*6.283,d=rr(10,big?42:30);drops.push([Math.cos(a)*d,Math.sin(a)*d*.6,rr(.8,big?3.4:2.6),a]);}
 const blob=[];for(let i=0;i<14;i++){const a=i/14*6.283,r=rr(4,big?13:9);blob.push(Math.cos(a)*r,Math.sin(a)*r*.8);}CB.fx.push({kind:'splat',x,y,col,drops,blob,t:0,life:1,big});}
function hit(a,b,dmg,tiles,col){const q=b.p,sp=isoP(q.gx,q.gy);
 if(onTiles(q,tiles)){if(damage(a,b,dmg,{bx:sp.x,by:sp.y-84})){splat(sp.x,sp.y-30,col,dmg>=15);CB.shake=dmg>=15?7:4;q.sqv=-3;if(CB.T.speedOnHit)CB.speed=.5;if(CB.T.onHit)CB.T.onHit(dmg);return true;}}
 else CB.miss.push({text:CB.T.words.miss,x:sp.x,y:sp.y-84,life:1,max:1});return false;}
function faceTo(p,q){const a=isoP(p.gx,p.gy),b=isoP(q.gx,q.gy);if(Math.abs(b.x-a.x)>1)p.face=b.x>a.x?1:-1;}
function fxAdd(e){e.t=0;CB.fx.push(e);return e;}
function knock(o,dx,dy){const q=o.p;if(free(q.gx+dx,q.gy+dy,o))startHop(q,q.gx+dx,q.gy+dy,.26,10);}
function lineDir(p,q){let dx=Math.sign(q.gx-p.gx),dy=Math.sign(q.gy-p.gy);if(dx!==0&&dy!==0){if(Math.abs(q.gx-p.gx)>=Math.abs(q.gy-p.gy))dy=0;else dx=0;}if(!dx&&!dy)dx=1;return [dx,dy];}
const fK=()=>CB.T.K;
function catPoint(f,lx,ly){const p=f.p,c=isoP(p.x,p.y),K=fK();return {x:c.x+lx*K*p.face,y:c.y+4-p.z+ly*K};}
function* tween(s,fn){for(let t=0;t<s;t+=DT){fn(Math.min(1,t/s));yield 0;}fn(1);}
const ATK={
 *claw(f,o,a){const p=f.p,q=o.p,T=[[q.gx,q.gy]],col=CB.T.col.claw;yield* telegraph(f,o,T,col,.7);p.claws=1;
  yield* tween(.18,k=>{p.arm=lerp(0,-1.5,k);p.lunge=k*.32;p.tail=k*.5;});const c=isoP(q.gx,q.gy);fxAdd({kind:'claw',x:c.x,y:c.y-34,life:.55,dir:p.face});
  yield* tween(.1,k=>{p.arm=lerp(-1.5,1.3,k);});if(hit(f,o,a.dmg,T,col))knock(o,q.gx-p.gx,q.gy-p.gy);
  yield* tween(.3,k=>{p.arm=lerp(1.3,0,k);p.lunge=.32*(1-k);p.tail=.5*(1-k);});p.claws=0;},
 *petal(f,o,a){const p=f.p,q=o.p,col=CB.T.col.petal,T=[[q.gx,q.gy]].concat(N4.map(([dx,dy])=>[q.gx+dx,q.gy+dy]).filter(([x,y])=>inB(x,y)));

  const ps=[];for(const [x,y] of T){const c=isoP(x,y);for(let i=0;i<9;i++)ps.push({cx:c.x,cy:c.y,a:Math.random()*6.283,r:rr(6,30),h:rr(4,40),s:rr(.8,1.3),sp:rr(5,9)});}
  const s=catPoint(f,24,-36);fxAdd({kind:'storm',ps,sx:s.x,sy:s.y,life:1.15});yield* wait(.62);
  for(const [x,y] of T){const d=isoP(x,y);splat(d.x,d.y-6,col,false);}hit(f,o,a.dmg,T,col);yield* wait(.3);yield* tween(.25,k=>{p.arm=lerp(-2.1,0,k);});},
 *gust(f,o,a){const p=f.p,q=o.p,col=CB.T.col.gust,[dx,dy]=lineDir(p,q),T=[];for(let k=1;k<GN;k++){const x=p.gx+dx*k,y=p.gy+dy*k;if(!inB(x,y))break;T.push([x,y]);}
  yield* telegraph(f,o,T,col,1);yield* tween(.22,k=>{p.arm=lerp(0,-1.2,k);p.tail=-k*.9;});
  fxAdd({kind:'gust',path:T,life:T.length*.11+.4,dx,dy});let did=false;
  for(let t=0;t<T.length*.11+.1;t+=DT){const w=Math.min(1,t/.15);p.arm=lerp(-1.2,1.4,w);p.tail=lerp(-.9,.9,w);const idx=Math.floor(t/.11);

  if(!did)hit(f,o,a.dmg,T,col);yield* wait(.25);yield* tween(.3,k=>{p.arm=lerp(1.4,0,k);p.tail=.9*(1-k);});},
 *beam(f,o,a){const p=f.p,q=o.p,col=CB.T.col.beam,[dx,dy]=lineDir(p,q),T=[];for(let k=1;k<GN;k++){const x=p.gx+dx*k,y=p.gy+dy*k;if(!inB(x,y))break;T.push([x,y]);}
  yield* telegraph(f,o,T,col,.9);yield* tween(.25,k=>{p.arm=lerp(0,-.35,k);p.glint=k*2.2;});
  const s=catPoint(f,5,-47.8),e=T[T.length-1],ec=isoP(e[0],e[1]);fxAdd({kind:'beam',sx:s.x,sy:s.y,ex:ec.x+dx*0,ey:ec.y-26,life:.7,path:T});CB.shake=3;
  yield* wait(.12);hit(f,o,a.dmg,T,col);yield* wait(.5);yield* tween(.25,k=>{p.arm=lerp(-.35,0,k);p.glint=2.2*(1-k);});},
 *swirl(f,o,a){const p=f.p,q=o.p,col=CB.T.col.swirl,T=[];for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(inB(q.gx+dx,q.gy+dy))T.push([q.gx+dx,q.gy+dy]);
  yield* telegraph(f,o,T,col,1.05);yield* tween(.28,k=>{p.arm2=lerp(0,1.9,k);p.arm=lerp(0,-1,k);p.tilt=k*.12;});const c=isoP(q.gx,q.gy);
  fxAdd({kind:'swirl',x:c.x,y:c.y,life:1});yield* wait(.5);CB.shake=6;hit(f,o,a.dmg,T,col);CB.decals.push({tiles:T,col,life:3.5,max:3.5});
  yield* wait(.35);yield* tween(.3,k=>{p.arm2=lerp(1.9,0,k);p.arm=lerp(-1,0,k);p.tilt=.12*(1-k);});},
 *cards(f,o,a){const p=f.p,q=o.p,col=CB.T.col.cards,T=[[q.gx,q.gy]];const nb=N8.map(([dx,dy])=>[q.gx+dx,q.gy+dy]).filter(([x,y])=>inB(x,y)).sort(()=>Math.random()-.5);T.push(...nb.slice(0,2));
  yield* telegraph(f,o,T,col,.85);yield* tween(.18,k=>{p.arm=lerp(0,-2.2,k);});yield* tween(.1,k=>{p.arm=lerp(-2.2,.9,k);});

  yield* wait(.36);for(const [x,y] of T){const d=isoP(x,y);splat(d.x,d.y-6,col,false);}hit(f,o,a.dmg,T,col);yield* wait(.3);yield* tween(.25,k=>{p.arm=lerp(.9,0,k);});}
};
function* turnG(f){const o=foe(f),p=f.p;yield* wait(.3);
 let i=pickAttack(f),pl=planMove(f,i);if(!pl.ok){const alt=[0,1,2].filter(j=>j!==i).sort(()=>Math.random()-.5).map(j=>({j,pl:planMove(f,j)})).find(a=>a.pl.ok);if(alt){i=alt.j;pl=alt.pl;f.lastAtk=i;}}
 CB.reach=Object.keys(pl.reach).map(k=>k.split(',').map(Number));CB.path=pl.path;yield* wait(.55);CB.reach=null;
 for(const st of pl.path.slice(1)){yield* hopG(p,st[0],st[1],.3,18);}
 CB.path=null;faceTo(p,o.p);if(!R.over){announce(f,i);f.atk={i,t:0};if(CB.T.speedOnAtk)CB.speed=.7;yield* ATK[f.c.attacks[i].k](f,o,f.c.attacks[i]);}
 f.atk=null;CB.pattern=null;yield* wait(.35);}

function drawFighter(f){const p=f.p,c=isoP(p.x,p.y);let x=c.x,y=c.y;
